plugins {
    id 'java'
    id 'application'
}

group 'com.berkebakar'
version '1.0.0'

repositories {
    mavenCentral()
    maven {
        url "https://download.eclipse.org/releases/latest/"
    }
}

dependencies {
    implementation 'commons-cli:commons-cli:1.5.0'
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.33.0'
    implementation 'org.apache.commons:commons-text:1.10.0'
    implementation files('lib/text-3.3.0-v20070606-0010.jar')
    implementation 'guru.nidi:graphviz-java-all-j2v8:0.18.1'


    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = "com.berkebakar.QualifierRemover.Main"
}

test {
    useJUnitPlatform()
}